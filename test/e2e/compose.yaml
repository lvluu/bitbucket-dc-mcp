services:
  bitbucket-dc-stub:
    build:
      context: .
    image: bitbucket-dc-stub:1.4.0
    container_name: bitbucket-dc-stub
    ports:
      - "7990:7990"
    environment:
      PORT: "7990"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:7990/rest/api/1.0/projects').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 3s
      timeout: 2s
      retries: 10
